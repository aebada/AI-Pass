appId: com.aipass.desktop
productName: AI-Pass
executableName: AI-Pass
copyright: Copyright © 2026 AI Pass

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../web/out
    to: web
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: resources/icon.png
  artifactName: AI-Pass-macOS-${arch}.${ext}

win:
  target:
    - portable
  icon: resources/icon.png
  artifactName: AI-Pass-Windows-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png
  executableName: AI-Pass
  maintainer: AI-Pass <contact@aipass.space>
  vendor: AI-Pass
  artifactName: AI-Pass-Linux-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
