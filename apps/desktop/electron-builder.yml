appId: com.aipass.desktop
productName: AI Pass
copyright: Copyright © 2026 AI Pass

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../web/out
    to: web
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: resources/icon.png

win:
  target:
    - nsis
    - portable
  icon: resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
