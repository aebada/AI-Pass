name: Bug report
description: Report a bug so we can reproduce and fix it
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search existing issues first.
        Security issues → see SECURITY.md (private report).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps, URLs, and commands
      placeholder: |
        1. pnpm dev:web
        2. Open http://localhost:3000/...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, pnpm version, browser (if UI)
      placeholder: macOS 15 · Node 22 · pnpm 9.15 · Chrome
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant terminal or browser console output
